name: Build InstagramCpp Static

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-windows-static:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install vcpkg
      run: |
        git clone https://github.com/microsoft/vcpkg
        cd vcpkg
        ./bootstrap-vcpkg.bat
        cd ..

    - name: Install static dependencies
      run: |
        cd vcpkg
        vcpkg install --triplet x64-windows-static curl[core,ssl] jsoncpp
        cd ..

    - name: Configure CMake for static build
      run: |
        mkdir build
        cd build
        cmake .. -DCMAKE_TOOLCHAIN_FILE=../vcpkg/scripts/buildsystems/vcpkg.cmake `
               -DCMAKE_BUILD_TYPE=Release `
               -DBUILD_SHARED_LIBS=OFF `
               -DCURL_USE_STATIC_LIBS=ON

    - name: Build static executable
      run: cmake --build build --config Release

    - name: Upload static executable
      uses: actions/upload-artifact@v4
      with:
        name: instagram-windows-static
        path: build/Release/instagram.exe
