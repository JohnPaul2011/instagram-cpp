name: Build Ubuntu Executable

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y g++ libcurl4-openssl-dev libjsoncpp-dev

    - name: Build executable
      run: |
        g++ -std=c++17 -I/usr/include/jsoncpp \
            instagram.cpp main.cpp \
            -lcurl -ljsoncpp -lz -o instagram

    - name: Upload executable
      uses: actions/upload-artifact@v4
      with:
        name: instagram-ubuntu
        path: instagram
