name: Build Static Executables

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    # ========== WINDOWS SETUP ==========
    - name: Setup vcpkg (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        git clone https://github.com/microsoft/vcpkg
        cd vcpkg
        ./bootstrap-vcpkg.bat
        cd ..

    - name: Install static dependencies (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        cd vcpkg
        vcpkg install --triplet x64-windows-static curl[core,ssl] jsoncpp
        cd ..

    # ========== LINUX SETUP ==========
    - name: Install static dependencies (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y libcurl4-openssl-dev libjsoncpp-dev

    # ========== BUILD ==========
    - name: Configure CMake
      run: |
        mkdir -p build
        cd build
        if [ "$RUNNER_OS" == "Windows" ]; then
          cmake .. -DCMAKE_TOOLCHAIN_FILE=../vcpkg/scripts/buildsystems/vcpkg.cmake -DCMAKE_BUILD_TYPE=Release
        else
          cmake .. -DCMAKE_BUILD_TYPE=Release
        fi
      shell: bash

    - name: Build static executable
      run: cmake --build build --config Release
      shell: bash

    # ========== UPLOAD ==========
    - name: Upload static executables
      uses: actions/upload-artifact@v4
      with:
        name: instagram-static-${{ matrix.os }}
        path: |
          build/Release/instagram${{ matrix.os == 'windows-latest' && '.exe' || '' }}
          !build/
